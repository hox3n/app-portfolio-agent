[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "portfolio-agent"
version = "0.1.0"
description = "AI agent for mobile app portfolio analytics: Q&A, UA budget review, anomaly checks."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core>=1.8,<2",
    "langchain-ollama>=1.1,<2",
    "duckdb>=2.0,<3",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlglot>=30.31,<31",
]

[project.optional-dependencies]
slack = ["slack-bolt>=1.20"]
langsmith = ["langsmith>=0.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
portfolio-agent = "portfolio_agent.interfaces.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests through the full agent graph",
    "ollama: needs a running local Ollama (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["portfolio_agent"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "sqlglot.*", "slack_bolt.*"]
ignore_missing_imports = true
